name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version-file: package.json
          node-version-file: package.json
          run-install: true
          cache: true
      - name: Check formatting, lint, and types
        run: vp check

  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version-file: package.json
          node-version-file: package.json
          run-install: true
          cache: true
      - name: Enforce architecture and Fallow regressions
        run: vp run fallow

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version-file: package.json
          node-version-file: package.json
          run-install: true
          cache: true
      - name: Run tests with coverage
        run: vp test --coverage
      - name: Report coverage
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          file-coverage-mode: changes
          show-uncovered-lines: true
          comment-on: none
      - name: Upload HTML coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  coverage_comment:
    name: Coverage Comment
    if: ${{ always() && needs.tests.result != 'cancelled' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-html
          path: coverage
      - name: Comment coverage report
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          file-coverage-mode: changes
          show-uncovered-lines: true
          comment-on: pr

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version-file: package.json
          node-version-file: package.json
          run-install: true
          cache: true
      - name: Build production site
        run: vp run build

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version-file: package.json
          node-version-file: package.json
          run-install: true
          cache: true
      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps chromium firefox webkit
      - name: Run visitor journeys
        run: vp run e2e
      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  dependency_review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, architecture, tests, build, e2e, dependency_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" ||
                "$ARCHITECTURE_RESULT" != "success" ||
                "$TESTS_RESULT" != "success" ||
                "$BUILD_RESULT" != "success" ||
                "$E2E_RESULT" != "success" ||
                ( "$DEPENDENCY_REVIEW_RESULT" != "success" &&
                  ( "$EVENT_NAME" == "pull_request" ||
                    "$DEPENDENCY_REVIEW_RESULT" != "skipped" ) ) ]]; then
            exit 1
          fi

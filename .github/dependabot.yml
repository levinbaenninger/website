version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: Europe/Zurich
    ignore:
      # Pin to the vitest bundled by vite-plus.
      - dependency-name: "@vitest/coverage-v8"
      # Needs a newer oxlint than vite-plus ships.
      - dependency-name: ultracite
        versions: ["7.10.6"]
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:43"
      timezone: Europe/Zurich
    groups:
      actions:
        patterns:
          - "*"

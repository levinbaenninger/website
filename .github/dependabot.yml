version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: Europe/Zurich
    ignore:
      # Must match the vitest version bundled by vite-plus or `vp test` fails
      # (see PR #72 and #79). Bump this only when upgrading vite-plus.
      - dependency-name: "@vitest/coverage-v8"
      # 7.10.6 ships oxlint presets that reference rules the vite-plus oxlint
      # does not have yet (`react/error-boundaries`).
      - dependency-name: ultracite
        versions: ["7.10.6"]
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:43"
      timezone: Europe/Zurich
    groups:
      actions:
        patterns:
          - "*"
